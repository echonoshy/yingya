<!-- Reusable explanatory scene. Replace all sample copy with the user's content.
     Set data-style-layout from the chosen style and --frame-width/height for the output.
     Use tokens.css + scenes.css, then animate with motion.js and a GSAP timeline. -->
<section class="ys-scene" data-style-layout="{{layout}}">
  <header class="ys-heading"><span class="ys-eyebrow">一个想法，三步呈现</span><h1 class="ys-title">让内容<br><em>清晰可见。</em></h1><p class="ys-subtitle">整理想法 · 展开重点 · 传递价值</p></header>
  <div class="ys-story">
    <div class="ys-step"><span class="ys-number">01</span><div><h2>整理想法</h2><p>找到值得讲述的主题</p></div><i class="ys-mark"></i></div>
    <div class="ys-step"><span class="ys-number">02</span><div><h2>展开重点</h2><p>让每个画面都有意义</p></div><i class="ys-mark"></i></div>
    <div class="ys-step"><span class="ys-number">03</span><div><h2>传递价值</h2><p>留下一个清晰的记忆</p></div><i class="ys-mark"></i></div>
  </div>
  <footer class="ys-footer"><span>映芽 · 视觉风格示例</span><span>相同内容，不同表达</span></footer>
</section>
